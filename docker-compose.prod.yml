services:
  # 1. PostgreSQL Database
  postgres:
    container_name: dayflow-postgres-prod
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dayflow_db}
    volumes:
      - dayflow_pgdata:/var/lib/postgresql/data
    networks:
      - dayflow-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dayflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Express REST API
  api:
    container_name: dayflow-api-prod
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dayflow_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — see server/.env.example}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost,https://127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dayflow-internal
    command: sh -c "node dist/db/migrate.js && node dist/server.js"

  # 3. Nginx HTTPS Web Server & Reverse Proxy
  web:
    container_name: dayflow-web-prod
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./src:/usr/share/nginx/html/src:ro
    depends_on:
      - api
    networks:
      - dayflow-internal

networks:
  dayflow-internal:
    driver: bridge

volumes:
  dayflow_pgdata:
